<!-- @dsCard group="Brand" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { display: flex; flex-direction: column; }
  section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 28px; }
  .on-cream { background: var(--lo-cream); }
  .on-green { background: var(--lo-green); }
  .on-slate { background: var(--lo-biz-bg); }
  .lo-logo { font-size: 34px; }
  .caption { font-family: var(--lo-font-sans); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  .on-cream .caption { color: var(--lo-ink-muted); }
  .on-green .caption, .on-slate .caption { color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
  <section class="on-cream">
    <span class="lo-logo"><span class="slashes">//</span> loan over</span>
    <span class="caption">sobre cream — barras green, palavras ink</span>
  </section>
  <section class="on-green">
    <span class="lo-logo on-dark">// loan over</span>
    <span class="caption">sobre green — tudo branco</span>
  </section>
  <section class="on-slate">
    <span class="lo-logo on-dark biz"><span class="slashes">//</span> loan over</span>
    <span class="caption">business — barras steel, palavras claras</span>
  </section>
</body>
</html>
